<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BellaVitta — Moda Feminina</title>
<meta name="description" content="Baby dolls, shorts, pijamas e conjuntos femininos. BellaVitta — Moda Feminina.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Cormorant+Garamond:ital,wght@1,600&display=swap">
<style>
:root{--bg:#fff;--fg:#111;--mut:#6b6b6b;--pink:#fbe3ea;--rose:#b3184f;--line:#ead9df;--card:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17110f;--fg:#f6eef1;--mut:#b9a9af;--pink:#3a2029;--rose:#ff6f9f;--line:#3b2a31;--card:#201719;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17110f;--fg:#f6eef1;--mut:#b9a9af;--pink:#3a2029;--rose:#ff6f9f;--line:#3b2a31;--card:#201719;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.5 Jost,system-ui,sans-serif;padding-bottom:72px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;max-width:1100px;margin:auto}
.logo{font:italic 600 28px Cormorant Garamond,Georgia,serif;color:var(--rose);border:0;background:none;padding:0;white-space:nowrap}
.search{flex:1;min-width:0;border:1px solid var(--line);border-radius:999px;padding:10px 16px;background:var(--card);color:var(--fg)}
.ic{border:0;background:none;position:relative;padding:6px;font-size:20px}
.badge{position:absolute;top:-2px;right:-4px;background:var(--rose);color:#fff;border-radius:999px;font-size:11px;min-width:18px;height:18px;line-height:18px;text-align:center}
.desk{display:none}
.banner{background:var(--pink);padding:28px 16px;text-align:center}
.banner h1{margin:0 0 6px;font-size:clamp(24px,5vw,38px);font-weight:600}
.banner p{margin:0;color:var(--mut)}
.benefits{display:flex;gap:8px 24px;justify-content:center;flex-wrap:wrap;padding:10px 16px;font-size:14px;border-bottom:1px solid var(--line)}
.benefits span::before{content:"✓ ";color:var(--rose)}
main{max-width:1100px;margin:auto;padding:16px}
.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 16px}
.chip[aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
h2{font-size:22px;margin:20px 0 12px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}.desk{display:flex;gap:16px}.bot{display:none!important}body{padding-bottom:0}}
@media(min-width:1000px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{border:1px solid var(--line);border-radius:10px;background:var(--card);overflow:hidden;display:flex;flex-direction:column}
.ph{aspect-ratio:1;background:linear-gradient(135deg,var(--pink),var(--bg));display:grid;place-items:center;text-align:center;color:var(--rose);font-size:13px;padding:8px;position:relative}
.ph b{font:italic 600 34px Cormorant Garamond,Georgia,serif}
.fav{position:absolute;top:6px;right:6px;border:0;background:var(--card);border-radius:50%;width:34px;height:34px}
.tag{position:absolute;top:6px;left:6px;background:var(--rose);color:#fff;font-size:12px;padding:2px 8px;border-radius:999px}
.info{padding:10px;display:flex;flex-direction:column;gap:6px;flex:1}
.name{border:0;background:none;text-align:left;padding:0;font-weight:500}
.price{font-size:20px;font-weight:600}
.old{color:var(--mut);text-decoration:line-through;font-size:14px;margin-right:6px}
.off{color:var(--rose);font-size:14px}
.btn{border:0;border-radius:8px;padding:12px 14px;background:var(--rose);color:#fff;font-weight:600;width:100%}
.btn.alt{background:var(--fg);color:var(--bg)}
.btn.out{background:none;color:var(--fg);border:1px solid var(--fg)}
.sizes{display:flex;gap:8px;flex-wrap:wrap}.sizes .chip{min-width:52px;padding:10px 14px;text-align:center}
.cs{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--card)}
.cs h4{margin:0;font-size:16px}
.fl{display:flex;flex-direction:column;gap:4px;font-size:14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{display:flex;gap:10px;align-items:center;border:1.5px solid var(--rose);border-radius:10px;padding:12px;background:var(--pink)}
.calc{display:flex;gap:10px;align-items:center;color:var(--mut)}
.spin{width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--rose);border-radius:50%;display:inline-block}
@media(prefers-reduced-motion:no-preference){.spin{animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}}
.pxhero{background:var(--pink);border-radius:14px;padding:16px;text-align:center}
.pxhero small{display:block;color:var(--mut)}
.pxhero .amt{font-size:34px;font-weight:600;line-height:1.2}
.badge2{display:inline-block;margin-top:8px;background:var(--card);border:1px solid var(--rose);color:var(--rose);border-radius:999px;padding:3px 12px;font-size:13px}
.qrbox{background:#fff;border-radius:12px;padding:12px;display:grid;place-items:center;border:1px solid var(--line)}
.qrbox img{width:100%;max-width:260px}
.stp{display:flex;gap:10px;align-items:flex-start}
.stp i{flex:none;width:24px;height:24px;border-radius:50%;background:var(--rose);color:#fff;font-style:normal;font-size:13px;display:grid;place-items:center}
details.sum summary{cursor:pointer;font-weight:500}
details.sum .row{margin-top:8px}
.lock{text-align:center;font-size:13px;color:var(--mut)}
.empty{color:var(--mut);padding:24px 0}
dialog{border:0;border-radius:14px;padding:0;width:min(520px,calc(100% - 24px));max-height:90dvh;background:var(--bg);color:var(--fg)}
dialog::backdrop{background:rgba(0,0,0,.45)}
@media(max-width:699px){dialog{width:100%;max-width:100%;height:100dvh;max-height:100dvh;border-radius:0}.dlg{padding:12px 16px calc(18px + env(safe-area-inset-bottom,0px))}.dlg>.ph{margin:0 -16px;border-radius:0}}
.dlg{padding:18px;display:flex;flex-direction:column;gap:12px}
.dlg h3{margin:0;font-size:22px}
.x{align-self:flex-end;border:0;background:none;font-size:22px}
select,input.f{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--card);color:var(--fg);font:inherit}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--card)}
.line{display:flex;gap:10px;border-bottom:1px solid var(--line);padding-bottom:10px}
.line .ph{width:64px;aspect-ratio:1;flex:none;border-radius:8px;font-size:0}
.line .ph b{font-size:22px}
.note{font-size:13px;color:var(--mut)}
.bot{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
.bot button{flex:1;border:0;background:none;padding:10px 0 8px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.bot span{font-size:20px}
footer{border-top:1px solid var(--line);padding:20px 16px;display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:center;font-size:14px}
footer button{border:0;background:none;text-decoration:underline;color:var(--mut)}
footer:empty{display:none}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:20}
@media(prefers-reduced-motion:no-preference){.toast{animation:t .2s}@keyframes t{from{opacity:0}}}
</style>
</head>
<body>
<header>
 <div class="top">
  <button class="logo" onclick="go('Todos')">BellaVitta</button>
  <input class="search" id="q" type="search" placeholder="O que você está procurando?" aria-label="Pesquisar" oninput="render()">
  <div class="desk"><button class="ic" onclick="showFavs()" aria-label="Favoritos">♡</button><button class="ic" onclick="info('conta')" aria-label="Minha conta">☺</button></div>
  <button class="ic" onclick="openCart()" aria-label="Carrinho">🛍<span class="badge" id="cc">0</span></button>
 </div>
</header>
<div class="banner"><h1>Sua próxima peça favorita está aqui</h1><p>Baby dolls, shorts, pijamas e conjuntos femininos</p></div>
<div class="benefits"><span>Ofertas especiais</span><span>Compra segura</span><span>Consulte as opções de entrega</span></div>
<main>
 <div class="cats" id="cats"></div>
 <h2 id="title">Todos os produtos</h2>
 <div class="grid" id="grid"></div>
 <div class="empty" id="empty" hidden>Nenhum produto nesta categoria ainda. Volte em breve.</div>
</main>
<footer id="foot"></footer>
<nav class="bot" aria-label="Menu principal">
 <button onclick="go('Todos')"><span>⌂</span>Início</button>
 <button onclick="document.getElementById('cats').scrollIntoView({behavior:'smooth'})"><span>☰</span>Categorias</button>
 <button onclick="showFavs()"><span>♡</span>Favoritos</button>
 <button onclick="openCart()"><span>🛍</span>Carrinho</button>
 <button onclick="info('conta')"><span>☺</span>Minha conta</button>
</nav>
<dialog id="dlg"><div class="dlg" id="dbody"></div></dialog>
<script>
/* ===== CONFIGURAÇÃO DA LOJA (edite aqui) ===== */
const STORE={cnpj:"",endereco:"",telefone:"",email:""};
const COUPONS={}; /* exemplo: "BEMVINDA10":{pct:10} */
const CATS=["Todos","Baby Dolls","Shorts Femininos","Conjuntos","Pijamas","Moda Verão","Sutiãs","Mais Vendidos","Ofertas"];
/* promo: preço promocional opcional; o desconto é calculado automaticamente */
const PRODUCTS=[
 {id:5,name:"Kit com 5 Baby Dolls",img:"file_00000000fed0820e8133906b1004d4c7.png",estoque:27,price:47.90,promo:null,cats:["Baby Dolls","Pijamas"],sizes:["P","M","G","GG"],colors:["Rosa-claro","Preto","Azul","Pink","Branco"],desc:"Kit com 5 baby dolls nas cores: rosa-claro, preto, azul, pink e branco. 💗"},
 {id:1,name:"Kit 3 Baby Dolls Femininos",img:"file_0000000013b8820ebdc62e39391fd960.png",estoque:37,price:27.90,promo:null,cats:["Baby Dolls","Pijamas"],sizes:["P","M","G","GG"],colors:["Cores disponíveis"],desc:"Kit com três peças para proporcionar conforto e praticidade na hora de dormir. Modelos, cores e estampas sujeitos às opções disponíveis."},
 {id:2,name:"Short Feminino de Verão",img:"file_00000000ed6c820ea83920a186dca583.png",estoque:32,price:23.90,promo:null,cats:["Shorts Femininos","Moda Verão"],sizes:["P","M","G","GG"],colors:["Estampas disponíveis"],desc:"Short feminino leve e confortável, ideal para aproveitar os dias quentes. Consulte as estampas e os tamanhos disponíveis."},
 {id:3,name:"Kit 3 Baby Dolls com Short",img:"file_000000006f10820ea5d86e97d0929364.png",price:27.90,promo:null,cats:["Baby Dolls","Conjuntos","Pijamas"],sizes:["P","M","G","GG"],colors:["Cores disponíveis"],desc:"Conjunto com três peças de dormir, pensado para oferecer conforto no dia a dia. Confira a composição do tecido, as medidas e as opções disponíveis."},
 {id:4,name:"Kit 3 Shorts Femininos Estampados",img:"file_000000007e60820eb8ddb6b17b4b0b21.png",price:20.90,promo:null,cats:["Shorts Femininos","Moda Verão"],sizes:["P","M","G","GG"],colors:["Estampas disponíveis"],desc:"Kit com três shorts femininos estampados, ideal para compor looks casuais de verão. Consulte a tabela de medidas antes de comprar."},
 {id:6,name:"Conjunto de Verão Pijama Preto Liso Feminino Baby Doll",img:"file_00000000e798820e9fdedc483108b5ce.png",price:22.40,promo:null,cats:["Baby Dolls","Conjuntos","Pijamas","Moda Verão"],sizes:["P","M","G","GG"],colors:["Preto"],desc:"Conjunto de verão pijama preto liso feminino Baby Doll."},
 {id:7,name:"Baby Doll Pijama Feminino Renda Rendado Noite Confortável",img:"file_00000000a354820ea63440e6f2d8b50e_convert.jpg",cimg:{"Azul marinho":"file_00000000a354820ea63440e6f2d8b50e_convert.jpg","Vermelho":"file_000000002b78820eae3549a0b65dcaf7_convert.jpg","Vinho":"file_000000003d28820e91973b11c90a1b45_convert.jpg"},price:20.40,promo:null,cats:["Baby Dolls","Pijamas"],sizes:["P","M","G","GG"],colors:["Azul marinho","Vermelho","Vinho"],desc:"Baby Doll Pijama Feminino Renda Rendado Noite Confortável."},
 {id:8,name:"Kit com 3 Baby Doll Short Doll Conforto Sensual Renda Luxo",img:"file_00000000ff00820eb76b4360376d5c0e_convert.jpg",price:30.90,promo:null,cats:["Baby Dolls","Conjuntos","Pijamas"],sizes:["P","M","G","GG"],colors:["Cores disponíveis"],desc:"Kit com 3 baby doll short doll, conforto sensual em renda de luxo. Consulte as cores e os tamanhos disponíveis."},
 {id:9,name:"Baby Doll Luxo Sensual Microfibra Pijama com Renda Decote V",img:"file_000000008b0c820e8f5b61500b262892_convert.jpg",price:23.40,promo:null,cats:["Baby Dolls","Pijamas"],sizes:["P","M","G","GG"],colors:["Cores disponíveis"],desc:"Baby Doll luxo sensual em microfibra, pijama com renda e decote V. Consulte as cores e os tamanhos disponíveis."},
 {id:10,name:"Kit 3 Baby Doll Plus Size para Dormir Pijama Feminino",img:"file_00000000f898820eb515c4909113eeb1_convert.jpg",price:27.90,promo:null,cats:["Baby Dolls","Pijamas"],sizes:["G1","G2","G3"],colors:["Cores disponíveis"],desc:"Kit com 3 baby dolls plus size para dormir, pijama feminino. Consulte as cores e os tamanhos disponíveis."},
 {id:11,name:"Baby Doll Luxo Sensual Microfibra Pijama com Renda Decote V",img:"file_00000000b5c8820eb33a44c005251239_convert.jpg",price:23.40,promo:null,cats:["Baby Dolls","Pijamas"],sizes:["P","M","G","GG"],colors:["Cores disponíveis"],desc:"Baby Doll luxo sensual em microfibra, pijama com renda e decote V. Consulte as cores e os tamanhos disponíveis."},
 {id:12,name:"Kit 3 Sutiã de Renda Alça Reforçada com Bojo Atacado Revenda",img:"file_0000000030f4820e911864175af0ba8a_convert.jpg",price:25.40,promo:null,cats:["Sutiãs"],sizes:["P","M","G","GG"],colors:["Cores disponíveis"],desc:"Kit com 3 sutiãs de renda com alça reforçada e bojo. Consulte as cores e os tamanhos disponíveis."}
];
const PAGES={
 conta:["Minha conta","O login de clientes será ativado quando a loja tiver banco de dados conectado."],
 sobre:["Sobre a BellaVitta","BellaVitta — Moda Feminina vende baby dolls, shorts, pijamas e conjuntos. Texto institucional a ser preenchido pela loja."],
 contato:["Contato e atendimento","Os canais de atendimento serão informados aqui pela loja (configure em STORE no código)."],
 faq:["Perguntas frequentes","Perguntas e respostas a serem cadastradas pela loja."],
 priv:["Política de Privacidade","Texto a ser definido pela loja, conforme a LGPD."],
 termos:["Termos de Uso","Texto a ser definido pela loja."],
 entrega:["Política de Entrega","Valores e prazos de frete serão informados ao cliente antes do pagamento. As opções de entrega ainda não estão conectadas a uma cotação automática."],
 trocas:["Trocas, Devoluções e Reembolsos","Nas compras feitas fora do estabelecimento comercial, você pode exercer o direito de arrependimento em até 7 dias, conforme a legislação. Para solicitar, entre em contato informando o número do pedido; você receberá as instruções de postagem e poderá acompanhar o reembolso. Produtos com defeito seguem os direitos e prazos do Código de Defesa do Consumidor."],
 rastreio:["Acompanhamento de pedido","O rastreio ficará disponível quando os pedidos forem conectados ao sistema da loja."]
};
/* ===== ESTADO ===== */
let cat="Todos",cart=[],favs=[];
try{cart=JSON.parse(localStorage.getItem("bv_cart")||"[]");favs=JSON.parse(localStorage.getItem("bv_favs")||"[]")}catch(e){}
const save=()=>{try{localStorage.setItem("bv_cart",JSON.stringify(cart));localStorage.setItem("bv_favs",JSON.stringify(favs))}catch(e){}};
const $=s=>document.querySelector(s);
const R=v=>v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const cur=p=>p.promo&&p.promo<p.price?p.promo:p.price;
const pct=p=>p.promo&&p.promo<p.price?Math.round((1-p.promo/p.price)*100):0;
const pimg=p=>p.img?`<img src="${p.img}" alt="${p.name}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover" onerror="this.remove()">`:"";
const ph=p=>`<div class="ph"><div><b>BellaVitta</b><br>Foto do produto</div>${pimg(p)}</div>`;
function priceHtml(p){if(p.price==null)return`<span class="price">Preço a definir</span>`;return pct(p)?`<span class="old">${R(p.price)}</span><span class="price">${R(p.promo)}</span> <span class="off">${pct(p)}% off</span>`:`<span class="price">${R(p.price)}</span>`}
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;(dlg.open?dlg:document.body).append(t);setTimeout(()=>t.remove(),1800)}
/* ===== VITRINE ===== */
function go(c){cat=c;$("#q").value="";render();scrollTo({top:0,behavior:"smooth"})}
function list(){const q=$("#q").value.trim().toLowerCase();return PRODUCTS.filter(p=>(cat==="Todos"||(cat==="Ofertas"?pct(p)>0:cat==="Mais Vendidos"?!!p.maisVendido:p.cats.includes(cat)))&&(!q||p.name.toLowerCase().includes(q)))}
function render(arr){
 $("#cats").innerHTML=CATS.map(c=>`<button class="chip" aria-pressed="${c===cat}" onclick="go('${c}')">${c}</button>`).join("");
 const a=arr||list();$("#title").textContent=arr?"Favoritos":(cat==="Todos"?"Todos os produtos":cat);
 $("#grid").innerHTML=a.map(p=>`<article class="card"><div class="ph" onclick="openP(${p.id})" style="cursor:pointer"><div><b>BellaVitta</b><br>Foto do produto</div>${pimg(p)}${p.maisVendido?`<span class="tag">Mais vendido</span>`:""}<button class="fav" aria-label="Favoritar" onclick="event.stopPropagation();fav(${p.id})">${favs.includes(p.id)?"♥":"♡"}</button></div><div class="info"><button class="name" onclick="openP(${p.id})">${p.name}</button><div>${priceHtml(p)}</div>${p.estoque!=null?`<div class="note">${p.estoque>0?p.estoque+" disponíveis":"Esgotado"}</div>`:""}<button class="btn" onclick="quick(${p.id})">Adicionar ao carrinho</button></div></article>`).join("");
 $("#empty").hidden=a.length>0;
 $("#cc").textContent=cart.reduce((s,i)=>s+i.q,0);
 $("#foot").innerHTML="";
}
function fav(id){favs=favs.includes(id)?favs.filter(x=>x!==id):[...favs,id];save();render()}
function showFavs(){cat="Todos";render(PRODUCTS.filter(p=>favs.includes(p.id)));scrollTo({top:0,behavior:"smooth"})}
/* ===== MODAIS ===== */
function show(h){$("#dbody").innerHTML=`<button class="x" onclick="dlg.close()" aria-label="Fechar">✕</button>`+h;if(!dlg.open)dlg.showModal()}
function info(k){const[t,b]=PAGES[k];show(`<h3>${t}</h3><p>${b}</p>`)}
function openP(id){
 const p=PRODUCTS.find(x=>x.id===id);
 show(`${ph(p)}<h3>${p.name}</h3><div>${priceHtml(p)}</div><p>${p.desc}</p>
 <div>Tamanho</div><input type="hidden" id="sz"><div class="sizes">${p.sizes.map(s=>`<button type="button" class="chip sz" aria-pressed="false" onclick="pick(this,'${s}')">${s}</button>`).join("")}</div>
 <div>Cor / estampa</div><input type="hidden" id="co" value="${p.colors.length==1?p.colors[0]:""}"><div class="sizes">${p.colors.map(s=>`<button type="button" class="chip cc" aria-pressed="${p.colors.length==1}" onclick="pickC(this,'${s}',${p.id})">${s}</button>`).join("")}</div>
 <label>Quantidade<input class="f" id="qt" type="number" min="1" value="1"></label>
 <p class="note">Tabela de medidas e composição do tecido: a loja informará aqui quando confirmadas. O frete será calculado antes do pagamento.</p>
 <div id="err" role="alert" style="color:var(--rose)"></div>
 <button class="btn" onclick="addSel(${p.id},false)">Adicionar ao carrinho</button>
 <button class="btn alt" onclick="addSel(${p.id},true)">Comprar agora</button>`);
}
function pick(b,s){$("#sz").value=s;document.querySelectorAll(".sz").forEach(x=>x.setAttribute("aria-pressed",x===b))}
function pickC(b,v,id){$("#co").value=v;document.querySelectorAll(".cc").forEach(x=>x.setAttribute("aria-pressed",x===b));const p=PRODUCTS.find(x=>x.id===id);if(p&&p.cimg&&p.cimg[v]){const h=document.querySelector("#dbody>.ph");if(h)h.outerHTML=ph({...p,img:p.cimg[v]})}}
function quick(id){openP(id)}
function addSel(id,buy){
 const s=$("#sz").value,c=$("#co").value,q=Math.max(1,parseInt($("#qt").value)||1);
 if(PRODUCTS.find(x=>x.id===id).price==null){$("#err").textContent="O preço deste produto ainda não foi definido pela loja.";return}
 {const pp=PRODUCTS.find(x=>x.id===id);if(pp.estoque!=null&&q>pp.estoque){$("#err").textContent=pp.estoque>0?"Temos apenas "+pp.estoque+" disponíveis.":"Produto esgotado.";return}}
 if(!s||!c){const e=$("#err");e.textContent=!s?"Escolha um tamanho para continuar.":"Escolha a cor ou estampa.";e.scrollIntoView({block:"center"});return}
 const f=cart.find(i=>i.id===id&&i.s===s&&i.c===c);f?f.q+=q:cart.push({id,s,c,q});
 save();render();toast("Adicionado ao carrinho");buy?checkout():dlg.close();
}
/* ===== CARRINHO ===== */
let coupon=null,couponCode="";
function openCart(){
 if(!cart.length){show(`<h3>Carrinho</h3><p class="empty">Seu carrinho está vazio.</p><button class="btn" onclick="dlg.close()">Continuar comprando</button>`);return}
 let sub=0;
 const rows=cart.map((i,n)=>{const p=PRODUCTS.find(x=>x.id===i.id);sub+=cur(p)*i.q;return`<div class="line">${ph(p)}<div style="flex:1"><div>${p.name}</div><div class="note">${i.s} · ${i.c}</div><div class="row"><div class="qty"><button aria-label="Diminuir" onclick="chg(${n},-1)">−</button>${i.q}<button aria-label="Aumentar" onclick="chg(${n},1)">+</button></div><b>${R(cur(p)*i.q)}</b></div><button class="note" style="border:0;background:none;text-decoration:underline;padding:0" onclick="chg(${n},-99)">Remover</button></div></div>`}).join("");
 const disc=coupon?sub*coupon.pct/100:0;
 show(`<h3>Carrinho</h3>${rows}
 <div class="row"><input class="f" id="cp" placeholder="Cupom de desconto"><button class="btn out" style="width:auto" onclick="applyC()">Aplicar</button></div>
 <div class="row"><span>Subtotal</span><b>${R(sub)}</b></div>
 ${disc?`<div class="row"><span>Desconto do cupom</span><b>−${R(disc)}</b></div>`:""}
 <div class="row"><span>Frete</span>${SHIPPING.length==1?`<b>${R(SHIPPING[0].preco)}</b>`:`<span class="note">Calculado na etapa de entrega</span>`}</div>
 <div class="row"><span>Total</span><b class="price">${R(sub-disc+(SHIPPING.length==1?SHIPPING[0].preco:0))}</b></div>
 <button class="btn" onclick="checkout()">Finalizar compra</button>
 <button class="btn out" onclick="dlg.close()">Continuar comprando</button>`);
}
function chg(n,d){cart[n].q+=d;if(cart[n].q<1)cart.splice(n,1);save();render();openCart()}
function applyC(){const c=COUPONS[$("#cp").value.trim().toUpperCase()];if(!c){toast("Cupom inválido");return}coupon=c;couponCode=$("#cp").value.trim().toUpperCase();openCart();toast("Cupom aplicado")}
const SHIPPING=[{nome:"Frete fixo",transp:"",preco:9,prazo:"5 a 10 dias"}]; /* ex.: {nome:"SEDEX",transp:"Correios",preco:25,prazo:"3 a 5 dias úteis"} */
let ck={ship:SHIPPING.length?0:null,ready:false},tm;
const dg=s=>(s||"").replace(/\D/g,"");
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>"&#"+c.charCodeAt(0)+";");
const mask={
 cpf:v=>{v=dg(v).slice(0,11);return v.replace(/^(\d{3})(\d{0,3})(\d{0,3})(\d{0,2}).*/,(m,a,b,c,d)=>a+(b?"."+b:"")+(c?"."+c:"")+(d?"-"+d:""))},
 tel:v=>{v=dg(v).slice(0,11);if(v.length<3)return v;const k=v.length>10?7:6;return "("+v.slice(0,2)+") "+v.slice(2,k)+(v.length>k?"-"+v.slice(k):"")},
 cep:v=>{v=dg(v).slice(0,8);return v.length>5?v.slice(0,5)+"-"+v.slice(5):v}
};
const IDS=["nm","cpf","tel","em","cep","rua","num","comp","bai","cid","uf","ref"];
function cpfOk(c){c=dg(c);if(c.length!==11||/^(\d)\1+$/.test(c))return false;for(let t=9;t<11;t++){let s=0;for(let i=0;i<t;i++)s+=c[i]*(t+1-i);if((s*10%11)%10!=c[t])return false}return true}
function tot(){let sub=0;cart.forEach(i=>{sub+=cur(PRODUCTS.find(x=>x.id===i.id))*i.q});const d=coupon?sub*coupon.pct/100:0;const f=ck.ready&&ck.ship!=null?SHIPPING[ck.ship].preco:0;return{sub,d,f,t:sub-d+f}}
function grab(){IDS.forEach(id=>{const e=$("#"+id);if(e)ck[id]=e.value.trim()})}
function inp(e,k){e.value=mask[k](e.value);ck[e.id]=e.value}
const fld=(id,l,a)=>`<label class="fl"><span>${l}</span><input class="f" id="${id}" ${a||""} value="${esc(ck[id])}"></label>`;
function checkout(){
 if(!cart.length){openCart();return}
 show(`<h3>Finalizar compra</h3>
 <section class="cs"><h4>1. Seus dados</h4>
  ${fld("nm","Nome completo",'autocomplete="name"')}
  ${fld("cpf","CPF",`inputmode="numeric" maxlength="14" placeholder="000.000.000-00" autocomplete="off" oninput="inp(this,'cpf')"`)}
  ${fld("tel","Celular com DDD",`type="tel" inputmode="numeric" maxlength="15" placeholder="(00) 00000-0000" autocomplete="tel" oninput="inp(this,'tel')"`)}
  ${fld("em","E-mail (opcional)",'type="email" autocomplete="email"')}
 </section>
 <section class="cs"><h4>2. Endereço de entrega</h4>
  ${fld("cep","CEP",`inputmode="numeric" maxlength="9" placeholder="00000-000" autocomplete="postal-code" oninput="inp(this,'cep');cepChange()"`)}
  <div class="note" id="cepmsg"></div>
  ${fld("rua","Rua ou avenida")}
  <div class="g2">${fld("num","Número",'inputmode="numeric" maxlength="8"')}${fld("comp","Complemento (opcional)")}</div>
  ${fld("bai","Bairro")}
  <div class="g2">${fld("cid","Cidade")}${fld("uf","Estado (UF)",'maxlength="2" autocapitalize="characters"')}</div>
  ${fld("ref","Referência (opcional)")}
 </section>
 <section class="cs"><h4>3. Entrega</h4><div id="dv"><p class="note">Digite o CEP para calcular a entrega.</p></div></section>
 <section class="cs"><h4>4. Resumo do pedido</h4><div id="sm"></div></section>
 <div id="err" role="alert"></div>
 <button class="btn" onclick="pay()">Pagar com Pix</button>
 <button class="btn out" onclick="grab();openCart()">Voltar ao carrinho</button>`);
 ck.ready=false;upd();if(dg(ck.cep).length===8)deliv(true);
}
function upd(){
 const t=tot();
 $("#sm").innerHTML=cart.map(i=>{const p=PRODUCTS.find(x=>x.id===i.id);return`<div class="row"><span>${i.q}× ${p.name} <span class="note">${i.s} · ${i.c}</span></span><b>${R(cur(p)*i.q)}</b></div>`}).join("")
 +`<div class="row"><span>Subtotal</span><b>${R(t.sub)}</b></div>`+(t.d?`<div class="row"><span>Cupom</span><b>−${R(t.d)}</b></div>`:"")
 +`<div class="row"><span>Frete</span><b>${ck.ready&&ck.ship!=null?R(t.f):"Informe o CEP"}</b></div><div class="row"><span>Total</span><b class="price">${R(t.t)}</b></div>`;
}
function cepChange(){
 clearTimeout(tm);ck.ready=false;
 if(dg(ck.cep).length<8){$("#dv").innerHTML=`<p class="note">Digite o CEP para calcular a entrega.</p>`;upd();return}
 deliv(false);fillCep(dg(ck.cep));
}
function deliv(instant){
 if(!SHIPPING.length){$("#dv").innerHTML=`<p class="note">A loja informará valor e prazo da entrega antes de qualquer cobrança.</p>`;ck.ready=true;upd();return}
 if(instant){showShip();return}
 $("#dv").innerHTML=`<div class="calc"><i class="spin"></i> Calculando rota de entrega…</div>`;upd();
 const c=ck.cep;tm=setTimeout(()=>{if(ck.cep===c)showShip()},1300);
}
function showShip(){
 ck.ready=true;if(ck.ship==null)ck.ship=0;
 $("#dv").innerHTML=SHIPPING.map((s,n)=>`<label class="opt"><input type="radio" name="sh" ${ck.ship===n?"checked":""} onchange="ck.ship=${n};upd()"><span style="flex:1"><b>${s.nome}</b><br><span class="note">${s.transp?s.transp+" · ":""}${s.prazo}</span></span><b>${R(s.preco)}</b></label>`).join("");
 upd();
}
async function fillCep(c){
 const m=$("#cepmsg");if(m)m.textContent="Buscando endereço…";
 let d=null;
 try{const r=await fetch(`https://viacep.com.br/ws/${c}/json/`);const j=await r.json();if(!j.erro)d={rua:j.logradouro,bai:j.bairro,cid:j.localidade,uf:j.uf}}catch(e){}
 if(!d){try{const r=await fetch(`https://brasilapi.com.br/api/cep/v1/${c}`);const j=await r.json();if(j.city)d={rua:j.street,bai:j.neighborhood,cid:j.city,uf:j.state}}catch(e){}}
 if(dg(ck.cep)!==c)return;
 if(!d){if(m)m.textContent="Não foi possível buscar o endereço. Preencha cidade e estado manualmente.";return}
 Object.entries(d).forEach(([k,v])=>{const e=$("#"+k);if(e&&v){e.value=v;ck[k]=v}});
 if(m)m.textContent="Endereço encontrado. Confira e informe o número.";
 const n=$("#num");if(n&&!n.value)n.focus();
}
let paying=false,lastCharge=null;
async function pay(){
 grab();let e="";
 if(ck.nm.split(" ").filter(Boolean).length<2)e="Informe nome e sobrenome.";
 else if(!cpfOk(ck.cpf))e="CPF inválido.";
 else if(dg(ck.tel).length!==11)e="O celular deve ter DDD e 9 dígitos.";
 else if(ck.em&&!/^\S+@\S+\.\S+$/.test(ck.em))e="E-mail inválido.";
 else if(dg(ck.cep).length!==8)e="O CEP deve ter 8 números.";
 else if(!ck.rua||!ck.num||!ck.bai||!ck.cid)e="Preencha rua, número, bairro e cidade.";
 else if(!/^[A-Za-z]{2}$/.test(ck.uf))e="Informe o estado com 2 letras.";
 else if(!ck.ready)e="Aguarde o cálculo da entrega.";
 const el=$("#err");el.style.color=e?"var(--rose)":"var(--fg)";
 if(e){el.textContent=e;el.scrollIntoView({block:"center"});return}
 if(paying)return;
 const key=JSON.stringify([cart,ck.cpf,ck.cep,couponCode]);
 if(lastCharge&&lastCharge.key===key){showPix(lastCharge.d);return}
 paying=true;const btn=document.querySelector("#dbody .btn:not(.out)");if(btn){btn.disabled=true;btn.textContent="Gerando Pix…"}
 el.textContent="";
 try{
  const r=await fetch("/api/charge",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({
   cliente:{nome:ck.nm,cpf:ck.cpf,tel:ck.tel,email:ck.em},
   endereco:{cep:ck.cep,rua:ck.rua,num:ck.num,comp:ck.comp,bai:ck.bai,cid:ck.cid,uf:ck.uf.toUpperCase(),ref:ck.ref},
   items:cart.map(i=>({id:i.id,q:i.q,s:i.s,c:i.c})),cupom:couponCode})});
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(d.erro||"Falha ao gerar o Pix.");
  lastCharge={key,d};showPix(d);
 }catch(err){
  el.style.color="var(--rose)";
  el.textContent=(err&&err.message&&err.message!=="Failed to fetch"?err.message:"Não foi possível gerar o Pix agora. Tente novamente em instantes.");
  if(btn){btn.disabled=false;btn.textContent="Pagar com Pix"}
 }finally{paying=false}
}
function showPix(d){
 const items=cart.map(i=>{const p=PRODUCTS.find(x=>x.id===i.id);return`<div class="row"><span>${i.q}× ${p.name} <span class="note">${i.s} · ${i.c}</span></span><b>${R(cur(p)*i.q)}</b></div>`}).join("");
 const sh=SHIPPING[ck.ship==null?0:ck.ship];
 show(`<div class="pxhero"><small>Total a pagar</small><div class="amt">${R(d.total)}</div><span class="badge2">⏳ Aguardando pagamento · Pedido #${esc(d.ref)}</span></div>
 ${d.qr?`<section class="cs"><div class="stp"><i>1</i><div><b>Escaneie o QR Code</b><div class="note">Abra o app do seu banco, escolha Pix e leia o código.</div></div></div><div class="qrbox"><img src="${d.qr}" alt="QR Code Pix"></div></section>`:""}
 ${d.brCode?`<section class="cs"><div class="stp"><i>${d.qr?2:1}</i><div><b>Ou use o Pix copia e cola</b><div class="note">Copie o código, abra o app do banco e escolha Pix copia e cola.</div></div></div><input class="f" readonly id="br" value="${esc(d.brCode)}" aria-label="Código Pix copia e cola"><button class="btn" onclick="copyBr(this)">Copiar código Pix</button></section>`:`<section class="cs"><p>A cobrança foi criada, mas o código Pix não veio do gateway. Fale com a loja informando o pedido #${esc(d.ref)}.</p></section>`}
 <details class="cs sum"><summary>Resumo da compra</summary>${items}<div class="row"><span>Frete${sh?" · "+sh.prazo:""}</span><b>${R(sh?sh.preco:0)}</b></div><div class="row"><span>Total</span><b>${R(d.total)}</b></div><div class="note" style="margin-top:8px">Entrega para ${esc(ck.rua)}, ${esc(ck.num)}${ck.comp?" – "+esc(ck.comp):""}, ${esc(ck.bai)}, ${esc(ck.cid)}/${esc((ck.uf||"").toUpperCase())}</div></details>
 <div class="lock">🔒 Pagamento via Pix</div>
 <p class="note" style="text-align:center">Guarde o comprovante. A confirmação automática do pagamento ainda não está ligada.</p>
 <button class="btn out" onclick="dlg.close()">Fechar</button>`);
}
function copyBr(b){const t=$("#br");const ok=()=>{if(b)b.textContent="Código copiado ✓";toast("Código copiado")};try{navigator.clipboard.writeText(t.value).then(ok)}catch(e){t.select();toast("Selecione e copie o código")}}
render();
</script>
</body>
</html>
